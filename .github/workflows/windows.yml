name: Windows build and offline tests
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream modules
        shell: pwsh
        run: ./tools/Fetch-PawnModules.ps1
      - name: Build
        shell: pwsh
        run: ./build.ps1 -OutputDirectory bin-next
      - name: Offline protocol and control tests (no hardware access)
        shell: pwsh
        run: |
          & ./bin-next/GalaxyHardware.exe self-test
          if ($LASTEXITCODE -ne 0) { throw 'Offline tests failed.' }
      - name: Fan editor mouse, numeric input, and preset persistence tests
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'editor-tests.json'
          $app = Start-Process ./bin-next/GalaxyHelper.exe -ArgumentList "--editor-self-test $report" -Wait -PassThru
          if (Test-Path ($report + '.error.txt')) { Get-Content ($report + '.error.txt') }
          if ($app.ExitCode -ne 0) { throw 'Editor test process failed.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.Success) { throw 'Editor tests failed.' }
          $result | ConvertTo-Json -Depth 4
      - name: Automatic setup, cancellation, restoration and error UI tests
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'setup-tests.json'
          $app = Start-Process ./bin-next/GalaxyHelper.exe -ArgumentList "--setup-self-test $report" -Wait -PassThru
          if (Test-Path ($report + '.error.txt')) { Get-Content ($report + '.error.txt') }
          if ($app.ExitCode -ne 0) { throw 'Setup test process failed.' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (!$result.Success) { throw 'Setup tests failed.' }
          $result | ConvertTo-Json -Depth 4
      - name: Native kernel policy tests (no driver installation)
        shell: pwsh
        run: ./tools/Test-NativePolicies.ps1
      - name: Capture first-run and calibrated editor layouts
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ui-preview'
          New-Item -ItemType Directory -Force $output | Out-Null
          $app = Start-Process ./bin-next/GalaxyHelper.exe -ArgumentList "--layout-preview $output/first-run.png" -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw 'Layout preview failed.' }
          $layout = Get-Content "$output/first-run.png.layout.json" -Raw | ConvertFrom-Json
          if (!$layout.Success) { throw ($layout | ConvertTo-Json -Depth 4) }
      - name: Upload UI previews and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-and-test-reports
          path: |
            ${{ runner.temp }}/ui-preview/
            ${{ runner.temp }}/*tests.json*
      - name: Build single EXE with embedded app and modules
        shell: pwsh
        run: ./packaging/Build-SingleExe.ps1 -AppDirectory bin-next -AppOnly
      - name: Execute installer preflight through Windows PowerShell with Korean UTF8 paths
        shell: pwsh
        run: ./tools/Test-InstallerPreflight.ps1
      - name: Verify single EXE and reject damaged or incomplete payloads
        shell: pwsh
        run: ./tools/Test-SingleExe.ps1
      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyHelper-single-exe
          path: artifacts/GalaxyHelper.exe
      - name: Package app for existing driver installations
        shell: pwsh
        run: |
          Copy-Item ./packaging/APP-UPDATE.ko.md ./bin-next/README.ko.md
          Compress-Archive -Path ./bin-next/* -DestinationPath ./GalaxyHelper-app.zip
      - name: Upload app EXEs
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyHelper-app
          path: GalaxyHelper-app.zip
