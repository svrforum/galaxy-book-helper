name: Verified experimental app release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/RELEASE-NOTES-v0.1.1-experimental.ko.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galaxy-helper-experimental-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/windows.yml
    permissions:
      contents: read
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GalaxyHelper-app
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: GalaxyHelper-single-exe
          path: release-files
      - name: Publish notes and verified single EXE
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag=v0.1.1-experimental
          release_asset=GalaxyHelper-v0.1.1-experimental-windows-x64.zip
          mv release-files/GalaxyHelper-app.zip "release-files/$release_asset"
          release_exe=GalaxyHelper-v0.1.1-experimental-windows-x64.exe
          mv release-files/GalaxyHelper.exe "release-files/$release_exe"
          (cd release-files && sha256sum "$release_asset" "$release_exe" > SHA256SUMS.txt)
          if gh release view "$release_tag" --json targetCommitish --jq .targetCommitish > release-target.txt 2>/dev/null; then
            test "$(cat release-target.txt)" = "$RELEASE_COMMIT" || { echo 'Existing release targets a different commit; refusing to replace it.'; exit 1; }
            gh release upload "$release_tag" "release-files/$release_asset" "release-files/$release_exe" release-files/SHA256SUMS.txt --clobber
          else
            gh release create "$release_tag" "release-files/$release_asset" "release-files/$release_exe" release-files/SHA256SUMS.txt --target "$RELEASE_COMMIT" --title 'Galaxy Book Helper v0.1.1-experimental · 단일 EXE · 빠른 시작' --notes-file packaging/RELEASE-NOTES-v0.1.1-experimental.ko.md --prerelease
          fi
          gh release view "$release_tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
